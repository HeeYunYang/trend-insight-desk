<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>트렌드 데스크</title>
<meta name="description" content="매일 아침 세계 정세, 지표, 큰 이야기, 트렌드 장부를 정리하는 트렌드 데스크">
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트렌드 데스크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}

/* Layout: a wire-desk notebook. Sticky tab rail on top, one reading column (~720px) below; briefs read like dated desk slips. */
:root{
  --bg:#F2F4F2; --surface:#FFFFFF; --ink:#141C1B; --muted:#5B6866; --line:#D6DDDA; --line-strong:#B9C3C0;
  --accent:#1B5A78; --accent-ink:#FFFFFF; --accent-soft:#E2ECF1;
  --up:#2E7548; --down:#A2412D; --warn:#94700F;
  --f-world:#56657A; --f-economy:#A86B12; --f-tech:#2C62B8; --f-food:#3D7D3A; --f-beauty:#B04A73; --f-korea:#B8322F; --f-rotation:#6B4FA8; --f-field:#1B5A78;
  --s1:#1B5A78; --s2:#B4602A; --s3:#5E8F3A; --s4:#8A4FA0; --s5:#9AA3A1; --band:rgba(27,90,120,.09);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171E1D; --ink:#E4EBE9; --muted:#8F9E9B; --line:#28322F; --line-strong:#3A4643;
  --accent:#7BB5D4; --accent-ink:#0F1413; --accent-soft:#1A2C35;
  --up:#6BBE8A; --down:#E3826C; --warn:#D6AC4B;
  --f-world:#9AA8BC; --f-economy:#D9A049; --f-tech:#7FA6EA; --f-food:#7DBB78; --f-beauty:#E184AA; --f-korea:#EB7B76; --f-rotation:#A88FE0; --f-field:#7BB5D4;
  --s1:#7BB5D4; --s2:#E09A62; --s3:#93C470; --s4:#C49BDB; --s5:#7E8A88; --band:rgba(123,181,212,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171E1D; --ink:#E4EBE9; --muted:#8F9E9B; --line:#28322F; --line-strong:#3A4643;
  --accent:#7BB5D4; --accent-ink:#0F1413; --accent-soft:#1A2C35;
  --up:#6BBE8A; --down:#E3826C; --warn:#D6AC4B;
  --f-world:#9AA8BC; --f-economy:#D9A049; --f-tech:#7FA6EA; --f-food:#7DBB78; --f-beauty:#E184AA; --f-korea:#EB7B76; --f-rotation:#A88FE0; --f-field:#7BB5D4;
  --s1:#7BB5D4; --s2:#E09A62; --s3:#93C470; --s4:#C49BDB; --s5:#7E8A88; --band:rgba(123,181,212,.12);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.sync b{font-weight:500;color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 12px 11px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
main{padding-block:20px 64px}
section[role=tabpanel]{display:grid;gap:22px}
h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:600;text-wrap:balance;line-height:1.45}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* date strip */
.datebar{display:flex;align-items:center;gap:8px}
.datebar select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:16px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}

/* slip = the day's brief header */
.slip{border-top:3px double var(--line-strong);padding-top:14px;display:grid;gap:8px}
.slip .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.slip .meta b{color:var(--ink);font-weight:500}
.headline{font-family:var(--display);font-size:clamp(20px,4.6vw,25px);line-height:1.4;margin:0;text-wrap:balance}
.focus{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--accent-soft);color:var(--ink);padding:3px 10px;border-radius:999px;justify-self:start}

.field{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.field::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--fc,var(--muted))}

/* deep analysis cards */
.deep{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cls{font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--line-strong);color:var(--muted)}
.cls[data-c="추세"]{border-color:var(--accent);color:var(--accent)}
.cls[data-c="판 변화"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fact{margin:0}
dl.grid{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:0;font-size:14px}
dl.grid dt{color:var(--muted);font-size:12.5px;padding-top:1px}
dl.grid dd{margin:0;min-width:0}
@media (max-width:480px){dl.grid{grid-template-columns:1fr;gap:2px}dl.grid dd{margin-bottom:8px}}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.action{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:14px}
.src{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tchip{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}

/* item list */
ul.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.items li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px;min-width:0}
ul.items .row1{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);flex:none}
.flag[data-f="surprise"]{color:var(--warn)}
.flag[data-f="new"]{color:var(--up)}
ul.items .why{font-size:14px;color:var(--ink)}

.counter{display:grid;gap:8px}
.counter .c{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;font-size:14px}

/* trends */
.trend{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.trend .statement{font-family:var(--display);font-size:17px;line-height:1.5;margin:0}
.stage{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--accent-soft)}
.conf{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls select,.controls input[type=range]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.evid{font-size:13px;color:var(--muted);margin:0;padding-left:18px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.cat{font-weight:600;white-space:nowrap}
.dir{font-family:var(--mono);font-size:12px;white-space:nowrap}

/* predictions */
.pred{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.prob{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.1}
.prob small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:4px}
.pstate{font-size:11.5px;padding:1px 8px;border-radius:4px;border:1px solid var(--line-strong)}
.pstate[data-s="hit"]{color:var(--up);border-color:var(--up)}
.pstate[data-s="miss"]{color:var(--down);border-color:var(--down)}
.score{display:flex;flex-wrap:wrap;gap:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.score div{display:grid}
.score b{font-family:var(--mono);font-size:20px;font-weight:500}

/* forms */
form.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
form.panel label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
form.panel input,form.panel textarea,form.panel select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
form.panel textarea{min-height:84px;resize:vertical}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.formrow{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:10}

.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:22px 18px;display:grid;gap:6px}
.empty h3{font-family:var(--display);font-size:17px}
.signal{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.signal .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* world layer */
.worldlist{list-style:none;margin:0;padding:0;counter-reset:w;display:grid}
.worldlist li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.worldlist li::before{counter-increment:w;content:counter(w);font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px;grid-row:span 4}
.worldlist .reg{font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.worldlist .spread{font-size:13.5px;color:var(--muted)}
.worldlist .spread b{font-weight:500;color:var(--ink)}
.storylink{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink);background:none;cursor:pointer;justify-self:start}
.layer{display:grid;gap:12px}
.layerhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.layerhead h2{font-size:22px}
/* stories */
.story{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0}
.story .head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:10px;height:6px;border-radius:1px;background:var(--line)}
.lvl i.on{background:var(--down)}
.sstat{font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--line-strong)}
.sstat[data-s="확전"]{color:var(--down);border-color:var(--down)}
.sstat[data-s="진정"]{color:var(--up);border-color:var(--up)}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:8px;font-size:14px}
.timeline .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.story h3{font-family:var(--display);font-size:18px;font-weight:700}
/* indicators */
.weather{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px}
.weather .sentence{font-family:var(--display);font-size:clamp(19px,4.4vw,23px);line-height:1.45;margin:0;text-wrap:balance}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.gauges{grid-template-columns:1fr}}
.gauge{display:grid;gap:5px;min-width:0}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gauge .lv{font-size:13px;font-weight:600}
.gauge .lv[data-l="높음"]{color:var(--down)} .gauge .lv[data-l="낮음"]{color:var(--accent)}
.gtrack{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--line) 0 35%,var(--band) 35% 65%,var(--line) 65% 100%)}
.gtrack i{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gauge .members{font-size:11.5px;color:var(--muted);line-height:1.4}
.rule{font-size:12px;color:var(--muted)}
.state{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.state[data-s="경계"]{color:var(--warn);border-color:var(--warn)}
.state[data-s="이례적"]{color:var(--accent-ink);background:var(--down);border-color:var(--down)}
.moved{display:grid;gap:12px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;min-width:0}
.icard .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.icard .nm{font-weight:600;font-size:14.5px}
.icard .val{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.icard .val small{font-size:12px;color:var(--muted);margin-left:4px}
.chg{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.short{font-size:13.5px;color:var(--muted);margin:0}
.why{font-size:14px;border-left:3px solid var(--accent);padding-left:10px}
svg.spark{width:100%;height:auto;display:block;overflow:visible}
svg.spark text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
details.group{border-top:1px solid var(--line);padding-top:10px}
details.group>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:10px}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary h3{font-family:var(--display);font-size:18px}
details.group>summary .sub{font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dots i[data-s="경계"]{background:var(--warn)} .dots i[data-s="이례적"]{background:var(--down)}
details.back summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none}
details.back summary::-webkit-details-marker{display:none}
details.back[open] summary{margin-bottom:8px}
.periods{display:flex;gap:4px}
.periods button{border:1px solid var(--line);background:none;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--lc);margin-right:5px;vertical-align:middle}
.cal{list-style:none;margin:0;padding:0;display:grid}
.cal li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cal .d{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
svg.map{display:block;min-width:720px;width:100%;height:auto}
svg.map text{font-family:var(--body);font-size:12px;fill:var(--ink)}
svg.map .edge{stroke:var(--line-strong);stroke-width:1.4;fill:none}
svg.map .node rect{fill:var(--bg);stroke:var(--line-strong)}
svg.map .node[data-s="경계"] rect{stroke:var(--warn);stroke-width:2}
svg.map .node[data-s="이례적"] rect{fill:var(--down);stroke:var(--down)}
svg.map .node[data-s="이례적"] text{fill:var(--accent-ink)}
svg.map .node.story rect{fill:var(--accent-soft);stroke:var(--accent)}
svg.map .node{cursor:pointer}
svg.map .col{font-size:11px;fill:var(--muted);letter-spacing:.04em}
.gloss{display:grid;gap:6px;font-size:13.5px}
.gloss b{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* static (GitHub Pages) build: read-only */
[data-act],[data-pact],#predform{display:none!important}
#td-banner{position:relative;z-index:20;background:var(--down);color:var(--accent-ink);padding:10px 16px;font-size:14px;text-align:center}

</style>
</head>
<body>
<script src="vault.js"></script>
<script>
/* Read-only stand-in for the Claude artifact database: serves data/bundle.json. */
(function(){
  const listeners=[]; let bundle=null, loadedAt=0, loading=null;
  function banner(msg){ let b=document.getElementById("td-banner"); if(!b){ b=document.createElement("div"); b.id="td-banner"; b.setAttribute("role","status"); document.body.prepend(b); } b.textContent=msg; b.hidden=!msg; }
  async function load(){
    if(loading) return loading;
    loading=(async()=>{
      try{
        const r=await fetch("data/bundle.json?t="+Date.now(),{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const j=await r.json();
        if(!j||typeof j!=="object"||!j.collections) throw new Error("bad bundle");
        bundle=j; loadedAt=Date.now(); window.TD_STATIC={generated_at:j.generated_at||""};
        banner("");
        return true;
      }catch(e){ console.warn("bundle load failed",e); banner("데이터를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요."); return false; }
      finally{ loading=null; }
    })();
    return loading;
  }
  const clone=o=>JSON.parse(JSON.stringify(o));
  function snapDoc(id,data){ return {id, exists:!!data, data:()=>data?clone(data):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function runQuery(q){
    let rows=((bundle&&bundle.collections[q.path])||[]).slice();
    if(q.order){ const {f,dir}=q.order; rows.sort((a,b)=>{ const x=a[f],y=b[f]; if(x===y) return 0; if(x==null) return 1; if(y==null) return -1; return (x<y?-1:1)*(dir==="desc"?-1:1); }); }
    else rows.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
    if(q.lim) rows=rows.slice(0,q.lim);
    const docs=rows.map(r=>{ const {id,...rest}=r; return snapDoc(id,rest); });
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
  }
  function emit(l){ try{ l.kind==="q" ? l.next(runQuery(l.q)) : l.next(snapDoc(l.path.split("/").pop(), bundle&&bundle.docs?bundle.docs[l.path]:undefined)); }catch(e){ console.error(e); } }
  const ro=()=>Promise.reject({code:"not_granted",message:"read-only"});
  function query(q){
    return {
      orderBy(f,dir){ return query({...q,order:{f,dir:dir||"asc"}}); },
      limit(n){ return query({...q,lim:n}); },
      where(){ return query(q); },
      async get(){ await load(); return runQuery(q); },
      onSnapshot(next){ const l={kind:"q",q,next}; listeners.push(l); load().then(ok=>{ if(ok) emit(l); }); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; },
      doc(id){ return docRef(q.path+"/"+id); },
      add:ro
    };
  }
  function docRef(path){
    return { id:path.split("/").pop(), path,
      async get(){ await load(); return snapDoc(path.split("/").pop(), bundle&&bundle.docs?bundle.docs[path]:undefined); },
      onSnapshot(next){ const l={kind:"d",path,next}; listeners.push(l); load().then(ok=>{ if(ok) emit(l); }); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; },
      set:ro, update:ro, delete:ro, collection(p){ return query({path:path+"/"+p}); } };
  }
  const DB={ collection:p=> String(p).startsWith("data/users/") ? window.TD_VAULT.collection() : query({path:p}), doc:docRef };
  window.claude={ use: async n => n==="db" ? DB : null };
  /* pick up the daily update when the app comes back to the foreground */
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState!=="visible" || Date.now()-loadedAt < 10*60*1000) return;
    const before=bundle&&bundle.generated_at;
    if(await load() && bundle.generated_at!==before) listeners.slice().forEach(emit);
  });
})();
</script>

<script>

const S = { briefs:[], stories:[], inds:[], indDay:null, indGroups:[], trends:[], slow:[], preds:[], sync:null, briefIdx:0, fieldFilter:"all", db:null, ready:false };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : null;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- tabs ---------- */

try{ const saved=localStorage.getItem("td-tab"); if(saved && $(saved)) selectTab(saved); }catch(e){}

/* ---------- brief ---------- */
function renderBrief(){
  const p=$("p-brief");
  if(!S.briefs.length){
    p.innerHTML = `<div class="empty"><h3>${S.ready ? "아직 도착한 브리프가 없습니다" : "브리프를 불러오는 중"}</h3>
      <p class="muted" style="margin:0">매일 아침 7시(태평양시)에 그날의 브리프가 여기에 쌓입니다. 6개 고정 분야와 요일별 순환 분야를 훑고, 새롭거나 예상 밖이거나 추적 중인 트렌드와 연결되는 항목만 남깁니다.</p></div>`;
    return;
  }
  const i=Math.min(S.briefIdx,S.briefs.length-1), b=S.briefs[i];
  const deep=b.deep||[], items=b.items||[];
  const counts={}; items.forEach(it=>counts[it.field]=(counts[it.field]||0)+1);
  const shown = S.fieldFilter==="all" ? items : items.filter(it=>it.field===S.fieldFilter);

  p.innerHTML = `
  <div class="datebar">
    <button class="iconbtn" id="bprev" aria-label="이전 날" ${i>=S.briefs.length-1?"disabled":""}>‹</button>
    <select id="bsel" aria-label="브리프 날짜">${S.briefs.map((x,k)=>`<option value="${k}" ${k===i?"selected":""}>${fmtDate(x.date)}${x.date===today()?" · 오늘":""}</option>`).join("")}</select>
    <button class="iconbtn" id="bnext" aria-label="다음 날" ${i<=0?"disabled":""}>›</button>
  </div>
  <div class="slip">
    <div class="meta"><span>훑음 <b>${esc(b.scanned ?? "–")}</b></span><span>통과 <b>${items.length}</b></span><span>심층 <b>${deep.length}</b></span>${b.generated_at?`<span>작성 ${esc(String(b.generated_at).slice(11,16))}</span>`:""}</div>
    <h1 class="headline">${esc(b.headline||"")}</h1>
    ${b.focus?`<span class="focus">오늘의 순환 분야 · ${esc(b.focus)}</span>`:""}
  </div>

  ${(b.world_top||[]).length?`<div class="layer">
    <div class="layerhead"><h2>세계 정세</h2><span class="label">세계적 중요도 순 · ${b.world_top.length}건</span></div>
    ${b.regions_quiet?`<p class="note" style="margin:0">큰 사건 없음: ${esc(b.regions_quiet)}</p>`:""}
    <ol class="worldlist">${b.world_top.map(w=>`<li>
      <span class="reg">${esc(w.region||"")}</span>
      <h3>${safeUrl(w.url)?`<a href="${esc(w.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(w.title)}</a>`:esc(w.title)}</h3>
      ${w.why?`<div>${esc(w.why)}</div>`:""}
      ${w.spread?`<div class="spread"><b>번질 수 있는 곳</b> ${esc(w.spread)}</div>`:""}
      <div class="src">${esc(w.source||"")}${w.story&&storyName(w.story)?` · <button class="storylink" data-story="${esc(w.story)}">${esc(storyName(w.story))} 추적 중 ›</button>`:""}</div>
    </li>`).join("")}</ol>
  </div>
  <div class="layerhead"><h2>내 분야</h2><span class="label">식음료 · 뷰티 · 기술 · 경제 · 한국</span></div>`:""}

  ${deep.length?`<div class="deep"><div class="sectionhead"><h2>심층 분석</h2><span class="label">${deep.length}건</span></div>
    ${deep.map(d=>`<article class="card">
      <div class="top">${fieldTag(d.field)}${d.class?`<span class="cls" data-c="${esc(d.class)}">${esc(d.class)}</span>`:""}</div>
      <h3>${esc(d.title)}</h3>
      <p class="fact">${esc(d.fact)}</p>
      <dl class="grid">
        ${d.surprise?`<dt>기대 대비 차이</dt><dd>${esc(d.surprise)}</dd>`:""}
        ${d.mechanism?`<dt>원인·메커니즘</dt><dd>${esc(d.mechanism)}</dd>`:""}
      </dl>
      <details class="more"><summary>2차 효과 · 이해관계 · 반증 조건</summary>
        <dl class="grid">
          ${d.context?`<dt>전후 맥락</dt><dd>${esc(d.context)}</dd>`:""}
          ${d.second_order?`<dt>2차 효과</dt><dd>${esc(d.second_order)}</dd>`:""}
          ${d.winners?`<dt>이익</dt><dd>${esc(d.winners)}</dd>`:""}
          ${d.losers?`<dt>손해</dt><dd>${esc(d.losers)}</dd>`:""}
          ${d.persistence?`<dt>반복·확산·지속</dt><dd>${esc(d.persistence)}</dd>`:""}
          ${d.falsifier?`<dt>반증 조건</dt><dd>${esc(d.falsifier)}</dd>`:""}
        </dl>
      </details>
      ${d.action?`<div class="action">${esc(d.action)}</div>`:""}
      ${(d.trends||[]).length?`<div class="chips">${d.trends.map(t=>trendName(t)?`<span class="tchip">${esc(trendName(t))}</span>`:"").join("")}</div>`:""}
      <div class="src">${esc(d.source||"")}${safeUrl(d.url)?` · <a href="${esc(d.url)}" target="_blank" rel="noopener">원문</a>`:""}</div>
    </article>`).join("")}</div>`:""}

  <div style="display:grid;gap:12px">
    <div class="sectionhead"><h2>통과 항목</h2><span class="label">${items.length}건</span></div>
    <div class="chips" id="ffilter">
      <button class="chip" data-f="all" aria-pressed="${S.fieldFilter==="all"}">전체 ${items.length}</button>
      ${Object.keys(FIELDS).filter(k=>counts[k]).map(k=>`<button class="chip" data-f="${k}" aria-pressed="${S.fieldFilter===k}">${FIELDS[k].name} ${counts[k]}</button>`).join("")}
    </div>
    <ul class="items">${shown.map(it=>`<li>
      <div class="row1">${fieldTag(it.field)}${it.flag?`<span class="flag" data-f="${esc(it.flag)}">${esc(FLAG[it.flag]||it.flag)}</span>`:""}</div>
      <h3>${safeUrl(it.url)?`<a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(it.title)}</a>`:esc(it.title)}</h3>
      ${it.why?`<div class="why">${esc(it.why)}</div>`:""}
      <div class="src">${esc(it.source||"")}${(it.trends||[]).map(t=>trendName(t)?` · <span class="tchip">${esc(trendName(t))}</span>`:"").join("")}</div>
    </li>`).join("")}</ul>
  </div>

  ${(b.counter||[]).length?`<div style="display:grid;gap:12px"><div class="sectionhead"><h2>반대 신호</h2><span class="label">확증 편향 점검</span></div>
    <div class="counter">${b.counter.map(c=>`<div class="c">${c.trend&&trendName(c.trend)?`<div class="label" style="margin-bottom:4px">${esc(trendName(c.trend))}</div>`:""}${esc(c.text)}${safeUrl(c.url)?` <a href="${esc(c.url)}" target="_blank" rel="noopener">원문</a>`:""}</div>`).join("")}</div></div>`:""}

  ${renderCandidatesFor(b.date)}
  `;
  $("bsel").onchange=e=>{S.briefIdx=+e.target.value; S.fieldFilter="all"; renderBrief();};
  $("bprev").onclick=()=>{S.briefIdx=i+1; S.fieldFilter="all"; renderBrief();};
  $("bnext").onclick=()=>{S.briefIdx=i-1; S.fieldFilter="all"; renderBrief();};
  $("ffilter").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.fieldFilter=c.dataset.f; renderBrief();});
  p.querySelectorAll("[data-story]").forEach(x=>x.onclick=()=>{ selectTab("t-stories"); const el=$("sty-"+x.dataset.story); if(el){ el.open=true; el.scrollIntoView({block:"start"}); } });
  wireTrendButtons(p);
}
function renderCandidatesFor(date){
  const c=S.trends.filter(t=>t.status==="candidate" && t.proposed_on===date);
  if(!c.length) return "";
  return `<div style="display:grid;gap:12px"><div class="sectionhead"><h2>새 트렌드 후보</h2><span class="label">채택하면 장부에 올라갑니다</span></div>
    ${c.map(candidateCard).join("")}</div>`;
}
function candidateCard(t){
  return `<div class="trend"><p class="statement">${esc(t.statement)}</p>
    ${t.why?`<div class="note">${esc(t.why)}</div>`:""}
    <div class="controls"><button class="btn primary" data-act="adopt" data-id="${esc(t.id)}">장부에 채택</button><button class="btn ghost" data-act="reject" data-id="${esc(t.id)}">보류</button></div></div>`;
}

/* ---------- indicators ---------- */
const GAUGES={anxiety:{name:"불안",hi:"높음",lo:"낮음"},money:{name:"돈의 가격",hi:"높음",lo:"낮음"},growth:{name:"성장",hi:"높음",lo:"낮음"}};
const FREQ={daily:"매일",weekly:"매주",monthly:"매월",quarterly:"분기",event:"발표 시"};
const SC=["--s1","--s2","--s3","--s4","--s5"];
const IND={period:{}, seen:new Set()};
try{ IND.seen=new Set(JSON.parse(localStorage.getItem("td-seen")||"[]")); }catch(e){}
function markSeen(id){ IND.seen.add(id); try{ localStorage.setItem("td-seen",JSON.stringify([...IND.seen])); }catch(e){} }
const DAY=864e5;
function lineKeys(x){ return (x.lines&&x.lines.length) ? x.lines.map(l=>l.key) : ["main"]; }
function ser(x,k){ const S0=x.series||{}; return (S0[k]||(k==="main"?S0.value:null)||[]).filter(p=>Array.isArray(p)&&p[0]&&typeof p[1]==="number").sort((a,b)=>a[0].localeCompare(b[0])); }
function windowPts(pts,win){ if(!pts.length) return pts; const end=new Date(pts[pts.length-1][0]).getTime(); const span=(win==="5y"?5*365:365)*DAY; return pts.filter(p=>new Date(p[0]).getTime()>=end-span); }
function pctile(arr,q){ const a=[...arr].sort((x,y)=>x-y); const i=(a.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); }
function analyze(x){
  const k=lineKeys(x)[0], pts=ser(x,k);
  if(!pts.length) return {state:"자료 없음",pts};
  const last=pts[pts.length-1], prev=pts.length>1?pts[pts.length-2]:null;
  const w=windowPts(pts,x.window).map(p=>p[1]);
  const out={pts,last,prev,change:prev?last[1]-prev[1]:null};
  if(w.length>=6){
    out.p20=pctile(w,.2); out.p80=pctile(w,.8);
    out.pct=Math.round(100*w.filter(v=>v<last[1]).length/(w.length-1||1));
    out.state = (out.pct<=10||out.pct>=90)?"이례적":(out.pct<=20||out.pct>=80)?"경계":"평소";
  } else out.state="평소";
  for(const t of (x.thresholds||[])){
    if((t.dir==="above"&&last[1]>t.v)||(t.dir==="below"&&last[1]<t.v)){ out.state="이례적"; out.crossed=t; }
  }
  return out;
}
const fmt=(v,u)=>{ if(v==null||isNaN(v)) return "–"; const a=Math.abs(v); const d=a>=1000?0:a>=100?1:2; return v.toLocaleString("ko-KR",{maximumFractionDigits:d,minimumFractionDigits:0}); };
const fmtChg=(c,u)=>{ if(c==null) return ""; const s=c>0?"▲":c<0?"▼":"–"; return `${s} ${fmt(Math.abs(c))}${/%|%p/.test(u)&&!/전년/.test(u)?"%p":""}`; };
function spark(x,a,{w=300,h=64,big=false,period}={}){
  const keys=lineKeys(x); let lines=keys.map((k,i)=>({k,i,pts:ser(x,k)})).filter(l=>l.pts.length);
  if(!lines.length) return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="자료 수집 중"><text x="${w/2}" y="${h/2}" text-anchor="middle">값을 모으는 중</text></svg>`;
  if(period){ const end=Math.max(...lines.map(l=>new Date(l.pts[l.pts.length-1][0]).getTime())); const span={"1m":31,"1y":366,"5y":1830}[period]*DAY; lines=lines.map(l=>({...l,pts:l.pts.filter(p=>new Date(p[0]).getTime()>=end-span)})).filter(l=>l.pts.length); }
  const all=lines.flatMap(l=>l.pts);
  const ts=all.map(p=>new Date(p[0]).getTime()), vs=all.map(p=>p[1]);
  let y0=Math.min(...vs), y1=Math.max(...vs);
  if(a.p20!=null&&lines.length===1){ y0=Math.min(y0,a.p20); y1=Math.max(y1,a.p80); }
  for(const t of (big?(x.thresholds||[]):[])){ y0=Math.min(y0,t.v); y1=Math.max(y1,t.v); }
  if(y0===y1){ y0-=1; y1+=1; }
  const pad=(y1-y0)*.08; y0-=pad; y1+=pad;
  const t0=Math.min(...ts), t1=Math.max(...ts)||t0+1;
  const L=big?44:4, R=big?(lines.length>1?70:14):8, T=6, B=big?22:6;
  const X=t=>L+(t1===t0?0.5:(t-t0)/(t1-t0))*(w-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(h-T-B);
  let g=""; const labs=[];
  if(a.p20!=null&&lines.length===1) g+=`<rect x="${L}" y="${Y(a.p80)}" width="${w-L-R}" height="${Math.max(1,Y(a.p20)-Y(a.p80))}" fill="var(--band)"/>`;
  if(big){ [y0+pad,(y0+y1)/2,y1-pad].forEach(v=>{ g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`; });

function gaugeCalc(){
  const out={};
  for(const g of Object.keys(GAUGES)){
    const mem=S.inds.filter(x=>x.gauge&&x.gauge.g===g).map(x=>({x,a:analyze(x)})).filter(m=>m.a.pct!=null);
    const vals=mem.map(m=>m.x.gauge.sign>0?m.a.pct:100-m.a.pct);
    const score=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length):null;
    out[g]={score, level: score==null?"자료 부족":score>=65?"높음":score<=35?"낮음":"보통", members:S.inds.filter(x=>x.gauge&&x.gauge.g===g)};
  }
  return out;
}

async function patchTrend(id,data,msg){
  if(!S.db){ toast("저장소에 연결되지 않아 저장하지 못했습니다"); return; }
  try{ await S.db.doc("trends/"+id).update({...data, updated:new Date().toISOString()}); if(msg) toast(msg); }
  catch(e){ toast("저장하지 못했습니다. 잠시 후 다시 시도해 주세요"); }
}
function wireTrendButtons(root){
  root.querySelectorAll("[data-act=adopt]").forEach(b=>b.onclick=()=>patchTrend(b.dataset.id,{status:"adopted",stage:"태동",confidence:0.5},"장부에 채택했습니다"));
  root.querySelectorAll("[data-act=reject]").forEach(b=>b.onclick=()=>patchTrend(b.dataset.id,{status:"rejected"},"보류했습니다"));
  root.querySelectorAll("[data-act=stage]").forEach(s=>s.onchange=()=>patchTrend(s.dataset.id,{stage:s.value},"단계를 바꿨습니다"));
  root.querySelectorAll("[data-act=conf]").forEach(r=>r.onchange=()=>patchTrend(r.dataset.id,{confidence:+r.value/100},"확신도를 저장했습니다"));
}

  ${done.length?`<div><h2 style="margin-bottom:4px">채점 완료</h2>${done.map(predRow).join("")}</div>`:""}

  $("predform").onsubmit=async e=>{
    e.preventDefault();

    const st=$("pf-s").value.trim(), pr=+$("pf-p").value/100, d=$("pf-d").value;
    if(!st||!d) return;
    try{ await S.db.collection("predictions").add({statement:st,probability:pr,made_on:today(),resolve_by:d,status:"open",source:"user"}); toast("예측을 기록했습니다"); $("pf-s").value=""; }

    try{ await S.db.doc("predictions/"+b.dataset.id).update({status:b.dataset.pact,resolved_on:today()}); toast("채점했습니다"); }

function renderPrivKind(kind){

    <label for="pf-${f}-text">${kind==="insight"?"생각":"관찰"}<textarea id="pf-${f}-text" required placeholder="${esc(K.ph)}">${esc(ed?.text||"")}</textarea></label>
    <div class="formrow">
      <label for="pf-${f}-tags">태그 (쉼표로 구분, 선택)<input id="pf-${f}-tags" value="${esc((ed?.tags||[]).join(", "))}"></label>
      ${kind==="insight"?`<label for="pf-${f}-link">연결 (선택)<select id="pf-${f}-link"><option value="">없음</option>${links.map(l=>`<option value="${esc(l.id)}" ${ed?.link===l.id?"selected":""}>${esc(l.t.length>60?l.t.slice(0,59)+"…":l.t)}</option>`).join("")}</select></label>`:""}
    </div>
    <div class="controls"><button class="btn primary" type="submit">${ed?"수정 저장":"기록"}</button>${ed?`<button class="btn ghost" type="button" id="pf-${f}-cancel">취소</button>`:""}</div>
  </form>
  ${list.length?`<div>${list.map(entryHtml).join("")}</div>`:`<div class="empty"><h3>${K.empty}</h3><p class="muted" style="margin:0">${K.emptySub}</p></div>`}`;

    const btn=ev.submitter||p.querySelector('button[type="submit"]'); if(btn) btn.disabled=true;
    try{
      if(ed){ await S.priv.col.doc(ed.id).update(data); S.priv.editing=null; toast("수정했습니다"); }
      else { await S.priv.col.doc(newId()).set({...data,created:data.updated,source:window.TD_VAULT?"web":"claude"}); toast("기록했습니다"); }
      renderPrivKind(kind);
    }catch(err){ toast(err&&err.message&&window.TD_VAULT?err.message:"저장하지 못했습니다. 잠시 후 다시 시도해 주세요"); if(btn) btn.disabled=false; }

function wirePrivLock(p){
  const V=window.TD_VAULT; if(!V) return;

  const tf=p.querySelector("#tokenform");
  if(tf) tf.onsubmit=async ev=>{ ev.preventDefault(); const msg=p.querySelector("#token-msg"); msg.textContent="확인 중…";
    try{ await V.setToken(p.querySelector("#gh-token").value.trim()); toast("이 기기에서 기록할 수 있습니다"); renderPrivate(); }catch(err){ msg.textContent=err.message||"토큰을 확인하지 못했습니다"; } };
  const lb=p.querySelector("#lockbtn"); if(lb) lb.onclick=()=>{ V.lock(); S.priv.status="wait"; S.priv.entries=[]; renderPrivate(); };
  const fg=p.querySelector("#forgettoken"); if(fg) fg.onclick=()=>{ V.forgetToken(); toast("토큰을 지웠습니다"); renderPrivate(); };
}
function renderSignals(){ renderPrivate(); }

function renderSync(){
  if(window.TD_STATIC){ const el=$("syncline"); const t=window.TD_STATIC.generated_at;
    el.innerHTML = t ? `업데이트 <b>${esc(t.slice(5,16).replace("T"," "))}</b>` : "&nbsp;"; return; }
  const el=$("syncline");
  if(!S.sync || !S.sync.last_synced_date){ el.innerHTML = S.ready ? "로컬 아카이브 · 동기화 대기" : "&nbsp;"; return; }
  const pending=S.briefs.filter(b=>b.date>S.sync.last_synced_date).length;
  el.innerHTML = `로컬 <b>${esc(S.sync.last_synced_date.slice(5))}</b>까지${pending?` · 대기 ${pending}일`:""}`;
}

function renderAll(){ renderBrief(); renderIndicators(); renderStories(); renderTrends(); renderSlow(); renderPreds(); renderSignals(); renderSync(); }
renderAll();

/* ---------- data ---------- */
(async()=>{
  const db = await window.claude?.use?.("db");
  S.ready = true;
  if(!db){ renderAll(); $("syncline").textContent="저장소에 연결할 수 없습니다"; return; }
  S.db = db;
  const docs = snap => snap.docs.map(d=>({id:d.id,...d.data()}));
  const err = () => {};
  db.collection("briefs").orderBy("date","desc").limit(120).onSnapshot(s=>{
    const prevDate = S.briefs[S.briefIdx]?.date;
    S.briefs = docs(s);
    const k = prevDate ? S.briefs.findIndex(b=>b.date===prevDate) : 0;
    S.briefIdx = k<0 ? 0 : k;
    renderBrief(); renderSync();
  }, err);
  db.collection("stories").onSnapshot(s=>{ S.stories=docs(s); renderStories(); renderBrief(); }, err);
  const keepOpen=fn=>{ const p=$("p-ind"); const og=[...p.querySelectorAll("details.group[open]")].map(d=>d.dataset.group); const ob=[...p.querySelectorAll("details.back[open]")].map(d=>(d.closest(".moved")?".moved ":"details.group ")+`details.back[data-ind="${d.dataset.ind}"]`); fn(); og.forEach(g=>{const d=p.querySelector(`details.group[data-group="${g}"]`); if(d) d.open=true;}); ob.forEach(sel=>p.querySelectorAll(sel).forEach(d=>d.open=true)); };
  db.collection("indicators").onSnapshot(s=>{ S.inds=docs(s); keepOpen(renderIndicators); }, err);
  db.doc("meta/indicator_groups").onSnapshot(d=>{ S.indGroups=d.exists?(d.data().groups||[]):[]; keepOpen(renderIndicators); }, err);
  db.doc("meta/indicators_day").onSnapshot(d=>{ S.indDay=d.exists?d.data():null; keepOpen(renderIndicators); }, err);
  db.collection("trends").onSnapshot(s=>{ S.trends=docs(s); renderTrends(); renderBrief(); }, err);
  db.collection("slow_vars").onSnapshot(s=>{ S.slow=docs(s); renderSlow(); }, err);
  db.collection("predictions").onSnapshot(s=>{ S.preds=docs(s); renderPreds(); }, err);
  if(window.TD_VAULT){ window.TD_VAULT.onUnlock=()=>startPrivate(db,"me"); if(window.TD_VAULT.unlocked) startPrivate(db,"me"); else renderPrivate(); }
  else { const user=await window.claude?.use?.("user"); const uid=user?await user.id():null; if(uid) startPrivate(db,uid); else { S.priv.status="noid"; renderPrivate(); } }
  db.doc("meta/sync").onSnapshot(d=>{ S.sync = d.exists ? d.data() : null; renderSync(); }, err);
})();
</script>
</body>
